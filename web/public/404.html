<!doctype html>
<html lang="en-GB">
  <head>

    <title>404: Page not found · Searchopoly</title>

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101828; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #101828; }
      .card { background: #fbf7ef; border-radius: 18px; padding: 40px 44px; max-width: 420px; margin: 24px; text-align: center; box-shadow: 0 0 0 8px #f3ecdf, 0 30px 80px -20px rgba(0,0,0,.6); }
      .code { font-size: 64px; font-weight: 800; letter-spacing: -0.04em; margin: 0; }
      .code span { color: #e8590c; }
      h1 { font-size: 20px; margin: 4px 0 10px; }
      p { color: #5d6577; line-height: 1.5; margin: 0 0 22px; }
      a { display: inline-block; background: #101828; color: #fbf7ef; text-decoration: none; font-weight: 650; padding: 10px 18px; border-radius: 999px; }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="code">4<span>0</span>4</p>
      <h1>Page not found</h1>
