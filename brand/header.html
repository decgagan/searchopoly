<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="brand.css">
<style>
  body { width: 1500px; height: 500px; position: relative; }
  /* A strip of the real board: one corner plus the top ranked squares, run along the top-right. */
  .strip { position: absolute; top: 66px; right: -40px; display: flex; transform: rotate(-2deg); transform-origin: right top; }
  .strip > * { margin-left: -2px; }
  .wordmark { font-size: 76px; line-height: 1; }
  .tag { margin-top: 12px; font-family: var(--display); font-weight: 600; font-size: 34px; color: var(--paper); opacity: .92; }
  .url { margin-top: 14px; display: inline-block; font-family: var(--display); font-weight: 700; font-size: 24px; color: #fff; background: var(--accent-strong); padding: 6px 14px; border-radius: 999px; }
  .copy { position: absolute; left: 520px; top: 248px; }
</style>
<body class="bg">
  <div class="strip" id="strip"></div>
  <div class="copy"><div class="wordmark">Search<b>opoly</b></div><div class="tag">The internet as a board game</div><div class="url">searchopoly.co.uk</div></div>
<script>
const ICONS = { arrow: '<path d="M40 24H10m0 0 11-11M10 24l11 11"/>' };
window.render = ({ sites, groups }) => {
  const strip = document.getElementById("strip");
  strip.innerHTML = `<div class="corner logon" style="--u:150px"><svg viewBox="0 0 48 48">${ICONS.arrow}</svg><span class="title">Log On</span><span class="text">Start here</span></div>` +
    sites.map(s => `<div class="sq" style="--u:100px;--set:${groups[s.group]}"><div class="band">${s.rank}</div><div class="body"><div class="tile">${s.brand.replace(/[^A-Za-z0-9]/g,"").slice(0,1)}</div><div class="brand">${s.brand}</div><div class="domain">${s.domain}</div></div></div>`).join("");
};
</script></body>
