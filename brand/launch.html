<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="brand.css">
<style>
  body { width: 1200px; height: 675px; padding: 34px 40px 0; }
  .head { display: flex; align-items: baseline; justify-content: space-between; color: var(--paper); }
  .wordmark { font-size: 40px; }
  .url { font-family: var(--display); font-weight: 700; font-size: 22px; color: #fff; background: var(--accent-strong); padding: 5px 14px; border-radius: 999px; }
  .boards { margin-top: 22px; display: flex; gap: 40px; justify-content: center; }
  figure { margin: 0; text-align: center; }
  figure img { width: 500px; height: 500px; display: block; border-radius: 6px; box-shadow: 0 10px 40px rgba(0,0,0,.45); }
  figcaption { margin-top: 10px; color: var(--paper); font-family: var(--display); font-weight: 700; font-size: 20px; }
  figcaption small { display: block; font-family: var(--body); font-weight: 400; font-size: 13px; opacity: .75; margin-top: 2px; }
</style>
<body class="bg">
  <div class="head"><div class="wordmark">Search<b>opoly</b></div><div class="url">searchopoly.co.uk</div></div>
  <div class="boards">
    <figure><img src="out/board-world.png"><figcaption>Most visited sites · October 2026<small>Source: Tranco + Cloudflare Radar</small></figcaption></figure>
    <figure><img src="out/board-people.png"><figcaption>Most viewed people · September 2026<small>Source: Wikimedia pageviews + Wikidata</small></figcaption></figure>
  </div>
</body>
