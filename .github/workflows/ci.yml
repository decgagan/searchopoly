name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pipeline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      # Smoke test for the share image the monthly job redraws (uses the runner's Google Chrome).
      - name: Render share image
        run: |
          npm run og --prefix web
          python3 -c "import struct; d=open('web/public/og.png','rb').read(); w,h=struct.unpack('>II', d[16:24]); assert (w,h)==(1200,630), (w,h); print('og.png', w, 'x', h, len(d), 'bytes')"
